<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="box">
        <h1>Truthy and Falsy Values</h1>
        <div>My variable </div>
        <div>a = <b id="item1"></b></div>
        <div>a = <b id="item2"></b></div>
    </div>
    

    <script>
        // Truthy and Falsy evaluations in conditional blocks
        const availableInventory = 0; // Falsy numerical value

        if (availableInventory) {
            console.log("Product ready for dispatch.");
        } else {
            console.log("Item out of stock."); // Executes because 0 evaluates to false
        }

        let loggedInUser = "Alex"; // Truthy string value
        if (loggedInUser) {
            console.log(`Welcome back, ${loggedInUser}`); // Executes
        }




    </script>
</body>
</html>
